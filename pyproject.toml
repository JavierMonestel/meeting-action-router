[project]
name = "meeting-action-router"
version = "1.0.0"
description = "Turn meeting transcripts into owned, dated follow-ups routed to Linear, Attio, Notion and Calendar."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "anthropic>=1.0",
  "httpx>=0.27",
  "pydantic>=2.8",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # long prompt strings and regexes; the formatter handles code

[tool.pytest.ini_options]
testpaths = ["tests"]
